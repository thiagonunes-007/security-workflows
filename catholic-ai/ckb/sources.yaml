    language: it
    license_status: verificar
    license_note: Hipótese - domínio público. A tradução CEI atual tem direitos reservados.
    ref_format: "Livro cap,vers"
    versification: vulgata
  - id: allioli_de
    title: Bibel, trad. Joseph Franz Allioli (séc. XIX, da Vulgata)
    authority: escritura
    language: de
    license_status: verificar
    license_note: Hipótese - domínio público (edições originais). A Einheitsübersetzung tem direitos.
    ref_format: "Livro cap,vers"
    versification: vulgata
  - id: torres_amat_es
    title: Sagrada Biblia, trad. Félix Torres Amat (1823-25, da Vulgata)
    authority: escritura
    language: es
    license_status: verificar
    license_note: Hipótese - domínio público. Alternativa - Scío de San Miguel.
    ref_format: "Livro cap,vers"
    versification: vulgata
  - id: crampon_fr
    title: La Sainte Bible, trad. Augustin Crampon (1904)
    authority: escritura
    language: fr
    license_status: verificar
    license_note: Hipótese - domínio público. A Bible de Jérusalem e a TOB têm direitos. Confirmar a numeração dos Salmos da edição (hebraica assumida).
    ref_format: "Livro cap,vers"
    versification: hebraica

