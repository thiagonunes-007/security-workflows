# Registro de fontes do CKB (Catholic Knowledge Base).
# license_status:
#   livre      -> domínio público ou licença que permite uso/indexação
#   licenciado -> temos autorização escrita (anexe em license_note)
#   verificar  -> NÃO ingerir ainda; falta confirmar direitos
#   bloqueado  -> não usar
# Os status abaixo são HIPÓTESES iniciais: confirme cada edição/tradução exata antes de ingerir.
sources:
  - id: vulgata_clementina
    title: Vulgata Clementina (latim)
    authority: escritura
    language: la
    license_status: livre
    license_note: Texto latino antigo, domínio público. Conferir a edição digital usada.
    ref_format: "Livro cap,vers"
    versification: vulgata
  - id: biblia_figueiredo
    title: Bíblia, trad. Pe. Antônio Pereira de Figueiredo (1778, da Vulgata)
    authority: escritura
    language: pt
    license_status: verificar
    license_note: Tradução católica antiga, provável domínio público; confirmar edição e grafia digital. Busca - sem texto digital livre acessível (só scans Princeton/Atla).
    ref_format: "Livro cap,vers"
    versification: vulgata
  - id: douay_rheims
    title: Douay-Rheims (inglês)
    authority: escritura
    language: en
    license_status: livre
    license_note: Domínio público (edição Challoner revisada pode variar; conferir).
    ref_format: "Livro cap,vers"
    versification: vulgata
  - id: biblia_almeida_arc
    title: Bíblia Almeida Revista e Corrigida
    authority: escritura
    language: pt
    license_status: bloqueado
    license_note: Tradução protestante SEM os livros deuterocanônicos; não serve como base católica.
    ref_format: "Livro cap,vers"
  - id: cic
    title: Catecismo da Igreja Católica
    authority: magisterio
    language: pt
    license_status: verificar
    license_note: Direitos da Libreria Editrice Vaticana / edições nacionais. Solicitar licença.
    ref_format: "CIC §N"
  - id: vaticano_ii
    title: Documentos do Concílio Vaticano II
    authority: magisterio
    language: pt
    license_status: verificar
    license_note: Publicados em vatican.va; ler condições de reprodução da LEV.
    ref_format: "Sigla n. N (ex.: LG 11)"
  - id: cdc_1983
    title: Código de Direito Canônico (1983)
    authority: magisterio
    language: pt
    license_status: verificar
    license_note: Verificar licença da edição portuguesa/brasileira.
    ref_format: "cân. N"
  - id: enciclicas
    title: Encíclicas e exortações apostólicas
    authority: magisterio
    language: pt
    license_status: verificar
    license_note: Vatican.va; confirmar condições de uso.
    ref_format: "Documento n. N"
  - id: denzinger
    title: Denzinger-Hünermann (Enchiridion Symbolorum)
    authority: magisterio
    language: pt
    license_status: verificar
    license_note: Edições modernas são protegidas; avaliar edição antiga em domínio público.
    ref_format: "DH N"
  - id: padres_nicenos
    title: Padres da Igreja (Ante-Nicene / Nicene / Post-Nicene Fathers)
    authority: padres
    language: en
    license_status: livre
    license_note: Traduções do séc. XIX, domínio público (CCEL / New Advent).
    ref_format: "Autor, Obra, livro.cap"
  - id: suma_dominicanos
    title: Suma Teológica (trad. inglesa dos Dominicanos, 1920)
    authority: teologo
    language: en
    license_status: livre
    license_note: Tradução de 1920, domínio público. Edições em português são protegidas.
    ref_format: "ST I, q.N, a.N"

  # ---- Línguas originais (Escritura) ----------------------------------------------------
  - id: sblgnt
    title: SBL Greek New Testament
    authority: escritura
    language: grc
    license_status: verificar
    license_note: Hipótese - CC BY 4.0 com atribuição. Confirmar termos e requisitos de crédito.
    ref_format: "Livro cap,vers"
    versification: na
  - id: lxx_swete
    title: Septuaginta (Swete, 1901) - inclui deuterocanônicos
    authority: escritura
    language: grc
    license_status: livre
    license_note: Swete 1901 (domínio público) transcrito pelo First1KGreek / Open Greek and Latin, CC BY-SA 4.0 (licença no cabeçalho de cada XML). Atribuição obrigatória; o arquivo derivado fica sob a mesma licença (ver ckb/corpus/lxx_swete.LICENSE.md).
    ref_format: "Livro cap,vers"
    versification: vulgata
  - id: wlc_hebrew
    title: Westminster Leningrad Codex (Open Scriptures Hebrew Bible)
    authority: escritura
    language: hbo
    license_status: livre
    license_note: README do openscriptures/morphhb - "The text of the WLC remains in the Public Domain"; lematização/morfologia (não usadas aqui) são CC BY 4.0 - creditar o Open Scriptures Hebrew Bible Project. Só protocanônicos; canon_ref via ckb/psalms.py, ckb/books_map.py e ckb/align.py.
    ref_format: "Livro cap,vers"
    versification: hebraica
  - id: nova_vulgata
    title: Nova Vulgata (edição oficial da Santa Sé)
    authority: escritura
    language: la
    license_status: verificar
    license_note: Texto oficial em latim publicado em vatican.va; direitos da LEV. Solicitar licença.
    ref_format: "Livro cap,vers"
    versification: vulgata

  # ---- Traduções católicas históricas (candidatas a domínio público) ----------------------
  - id: martini_it
    title: Bibbia, trad. Antonio Martini (1769-1781, da Vulgata)
    authority: escritura
    language: it
    license_status: verificar
    license_note: Hipótese - domínio público. A tradução CEI atual tem direitos reservados. Busca em 2026 - nenhum texto digital livre acessível (só scans/Wikisource). Alternativa - OCR do Wikisource it.
    ref_format: "Livro cap,vers"
    versification: vulgata
  - id: allioli_de
    title: Bibel, trad. Joseph Franz Allioli (ed. 1914, da Vulgata)
    authority: escritura
    language: de
    license_status: livre
    license_note: Allioli (+1873), ed. 1914, domínio público por idade; texto digital de github.com/AlexBocken/allioli (Unlicense). Cobre 68 de 73 livros (faltam 1-2 Reis, Esdras, Romanos, Hebreus). Confirmar a procedência da transcrição.
    ref_format: "Livro cap,vers"
    versification: vulgata
  - id: torres_amat_es
    title: Sagrada Biblia, trad. Félix Torres Amat (1823-25, da Vulgata)
    authority: escritura
    language: es
    license_status: verificar
    license_note: Hipótese - domínio público. Alternativa - Scío de San Miguel. Busca - só scans (Internet Archive, Atla); OCR com erros. Scío idem. A Platense (Straubinger, scrollmapper) tem direitos incertos - não usada.
    ref_format: "Livro cap,vers"
    versification: vulgata
  - id: crampon_fr
    title: La Sainte Bible, trad. Augustin Crampon (1904)
    authority: escritura
    language: fr
    license_status: verificar
    license_note: Hipótese - domínio público. A Bible de Jérusalem e a TOB têm direitos. Confirmar a numeração dos Salmos da edição (hebraica assumida). Crampon 1923 existe no scrollmapper (73 livros, pipeline pronto), mas a edição de 1923 é revisão coletiva com direitos incertos - não incluída.
    ref_format: "Livro cap,vers"
    versification: hebraica

